name: E2E - Playwright

on:
  pull_request:
    # An API contract change can break the UI, so api/** changes run the
    # suite too. The job skips while ui/ doesn't exist yet.
    paths:
      - "ui/**"
      - "api/**"
      - ".github/workflows/e2e-playwright.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Playwright config
        id: check
        run: |
          # Skipping is only correct while ui/ doesn't exist yet. Once
          # ui/package.json exists, a missing Playwright config fails the
          # job rather than silently skipping: this is the only check that
          # proves the cross-stack UI<->API<->Blob contract (see REVIEW.md).
          if [ ! -f ui/package.json ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ui/package.json not found yet; skipping E2E."
          elif [ -f ui/playwright.config.ts ] || [ -f ui/playwright.config.js ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ui/package.json exists but no playwright.config.ts|js was found. The UI must have a runnable Playwright E2E suite before CI can be green." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        run: npm ci

      # The Playwright webServer starts the API with `dotnet run`; the runner
      # image doesn't ship .NET 10. Same version as ci-api.yml.
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'true'
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        if: steps.check.outputs.exists == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Get Playwright version
        id: pw
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # Chromium is the only browser playwright.config.ts uses.
      - uses: actions/cache@v4
        id: pw-cache
        if: steps.check.outputs.exists == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.check.outputs.exists == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # The browser cache doesn't hold the apt packages Chromium needs.
      - name: Install Playwright system dependencies
        if: steps.check.outputs.exists == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: ui
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        # The Playwright config's webServer must start the app against a
        # test Entra ID tenant / test API before this step runs.
        run: npx playwright test

      - name: Upload Playwright report
        if: steps.check.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
