name: Copilot setup steps

# Prepares the Copilot cloud agent's environment before each session, so
# scripts/verify.sh can run the same checks as CI. The job name must be
# exactly `copilot-setup-steps`. Running this workflow on its own (manually or
# when it changes) checks that the setup still works.
#
# Keep this lean: it runs before every Copilot session, even one-line tasks.
# Playwright browsers are not installed here; scripts/verify.sh installs
# Chromium the first time a session runs the E2E check.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same versions as ci-ui.yml / ci-api.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install UI dependencies
        if: hashFiles('ui/package-lock.json') != ''
        working-directory: ui
        run: npm ci

      - uses: actions/cache@v4
        if: hashFiles('api/**/*.csproj') != ''
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore API dependencies
        if: hashFiles('api/**/*.csproj') != ''
        working-directory: api
        run: dotnet restore
