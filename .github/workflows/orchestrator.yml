name: Orchestrator - loop control

# State machine that drives the implement -> test -> review loop described in
# docs/orchestration.md. It never merges anything and never runs before a
# human has added the `approved-plan` label. It only manages labels/comments;
# the actual implement/test/review work is done by agent sessions (Copilot
# coding agent + reviewer agent) reacting to those labels/comments.

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  # Identity assigned to kick off implementation. Centralized here so it can
  # be updated in one place if the coding-agent account name ever changes.
  IMPLEMENTER_ASSIGNEE: copilot
  # Hard cap on implement/test/review cycles. Centralized so labels.yml's
  # iteration-1..N labels and the loop logic below stay in sync if changed.
  MAX_ITERATIONS: 3
  # Prefix for the auto-created working branch: <prefix>/<issue-number>.
  WORK_BRANCH_PREFIX: story

jobs:
  release-approved-plan:
    # Plan interview & approval gate -> creates the working branch/draft PR
    # and kicks off iteration 1.
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'approved-plan' &&
      !contains(github.event.issue.labels.*.name, 'stage:paused')
    runs-on: ubuntu-latest
    # Serialize runs per issue: the branch/PR existence checks below are
    # check-then-act, so two concurrent runs for the same issue (e.g. a
    # duplicate/retried label event) could otherwise both pass the "doesn't
    # exist yet" check and create duplicate branches/PRs.
    concurrency:
      group: release-approved-plan-${{ github.event.issue.number }}
    # Creating the git ref/commit for the working branch needs contents:
    # write, on top of the workflow-level issues/pull-requests permissions.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Move issue into implementation, open branch/PR, start iteration 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ env.IMPLEMENTER_ASSIGNEE }}
          MAX_ITERATIONS: ${{ env.MAX_ITERATIONS }}
          BRANCH: ${{ env.WORK_BRANCH_PREFIX }}/${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          CURRENT_LABELS="$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name')"
          export CURRENT_LABELS
          # Note: if the issue has no labels, CURRENT_LABELS is empty and
          # every check in the shared script below simply won't match —
          # safe by design. `set -e` also means a failed `gh issue view`
          # call aborts this step rather than silently proceeding as if
          # there were no labels.

          .github/scripts/remove-labels-if-present.sh issue "$ISSUE" \
            "stage:interview" "stage:planned"

          gh issue edit "$ISSUE" --repo "$REPO" \
            --add-label "stage:implementing" --add-label "iteration-1"

          # Labels say "implementing" from here on; if anything below fails,
          # every failure path removes it again and adds stage:blocked so
          # the state never claims progress that didn't actually happen.
          block_issue() {
            gh issue edit "$ISSUE" --repo "$REPO" \
              --remove-label "stage:implementing" --add-label "stage:blocked"
            gh issue comment "$ISSUE" --repo "$REPO" --body "$1"
          }

          default_branch="$(gh api "repos/$REPO" --jq '.default_branch')"
          pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state all \
            --json number --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            echo "::notice::Reusing existing PR #$pr_number for branch '$BRANCH'."
          else
            if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              echo "::notice::Branch '$BRANCH' already exists; reusing it."
            else
              base_sha="$(gh api "repos/$REPO/git/ref/heads/$default_branch" --jq '.object.sha')"
              base_tree="$(gh api "repos/$REPO/git/commits/$base_sha" --jq '.tree.sha')"
              # An empty commit (same tree as the base) is enough to let
              # GitHub open a PR immediately — creating a PR only requires
              # head to be ahead of base by commits, not to already contain
              # file changes. The real changes land via later pushes.
              if ! new_commit="$(gh api "repos/$REPO/git/commits" \
                  -f message="Start implementation for #$ISSUE" \
                  -f tree="$base_tree" -f "parents[]=$base_sha" --jq '.sha')"; then
                block_issue "Plan approved, but creating the working branch failed (could not create the initial commit). Loop stopped: **stage:blocked** — create the branch/PR manually, then re-apply \`stage:implementing\` to resume."
                exit 0
              fi
              if ! gh api "repos/$REPO/git/refs" \
                  -f ref="refs/heads/$BRANCH" -f sha="$new_commit" >/dev/null; then
                block_issue "Plan approved, but creating the working branch '$BRANCH' failed. Loop stopped: **stage:blocked** — create the branch/PR manually, then re-apply \`stage:implementing\` to resume."
                exit 0
              fi
            fi

            issue_title="$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq '.title')"
            pr_body="$(sed "s/#<!-- issue number -->/#$ISSUE/" .github/PULL_REQUEST_TEMPLATE.md)"

            if ! pr_url="$(gh pr create --repo "$REPO" --base "$default_branch" --head "$BRANCH" \
                --draft --title "$issue_title (#$ISSUE)" --body "$pr_body")"; then
              block_issue "Plan approved, and branch \`$BRANCH\` was created, but opening the draft PR failed. Loop stopped: **stage:blocked** — open the PR manually from that branch, then re-apply \`stage:implementing\` to resume."
              exit 0
            fi
            pr_number="${pr_url##*/}"
          fi

          # Mirror area:* labels from the issue onto the PR, plus pipeline
          # state — handle-review-verdict (below) manages PR labels, not
          # issue labels, from this point on.
          gh pr edit "$pr_number" --repo "$REPO" \
            --add-label "stage:implementing" --add-label "iteration-1"
          while IFS= read -r label; do
            [ -n "$label" ] && gh pr edit "$pr_number" --repo "$REPO" --add-label "$label"
          done < <(grep -x 'area:[a-z0-9-]*' <<<"$CURRENT_LABELS" || true)

          if gh issue edit "$ISSUE" --repo "$REPO" --add-assignee "$ASSIGNEE"; then
            gh issue comment "$ISSUE" --repo "$REPO" --body \
              "Plan approved. Opened draft PR #$pr_number on branch \`$BRANCH\` and started **iteration 1/$MAX_ITERATIONS**: implement -> test -> review. See \`docs/orchestration.md\`."
            gh pr comment "$pr_number" --repo "$REPO" --body \
              "Assigned \`$ASSIGNEE\` to implement this story. Starting **iteration 1/$MAX_ITERATIONS**: implement -> test -> review."
          else
            # Labels say "implementing" but no agent was actually assigned —
            # make that discrepancy visible rather than leaving it implicit.
            gh pr edit "$pr_number" --repo "$REPO" \
              --remove-label "stage:implementing" --add-label "stage:blocked"
            block_issue "Plan approved and draft PR #$pr_number opened, but auto-assigning \`$ASSIGNEE\` failed. Loop stopped: **stage:blocked** — assign an implementer manually, then re-apply \`stage:implementing\` to resume."
          fi

  handle-review-verdict:
    # Peer review stage -> decides whether to stop or loop again.
    if: >-
      github.event_name == 'pull_request_review' &&
      !contains(github.event.pull_request.labels.*.name, 'stage:paused')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advance or stop the loop based on the review verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          MAX_ITERATIONS: ${{ env.MAX_ITERATIONS }}
        run: |
          set -euo pipefail
          # Reviews drive privileged label transitions (up to
          # stage:ready-for-human), so only act on reviews from someone with
          # at least write access — a read/triage-only reviewer's verdict
          # must not be able to advance or stop the loop. Fail safe (skip,
          # don't hard-fail the job) if the permission check itself can't be
          # made, e.g. due to token scope limits on this endpoint.
          permission_err=""
          if ! permission="$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq '.permission' 2>/tmp/permission_err)"; then
            permission_err="$(cat /tmp/permission_err)"
            echo "::warning::Could not determine repository permission for '$REVIEWER' ($permission_err); skipping this review verdict rather than risk acting without authorization."
            exit 0
          fi
          case "$permission" in
            write|maintain|admin) ;;
            *)
              echo "::notice::Ignoring review from '$REVIEWER' (permission: $permission) — insufficient access to drive the orchestrator."
              exit 0
              ;;
          esac

          CURRENT_LABELS="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')"
          export CURRENT_LABELS

          found_iteration=""
          current_iteration=1
          iteration_label_count=0
          for ((n = 1; n <= MAX_ITERATIONS; n++)); do
            if grep -qx "iteration-$n" <<<"$CURRENT_LABELS"; then
              found_iteration=1
              current_iteration=$n
              iteration_label_count=$((iteration_label_count + 1))
            fi
          done
          if [ -z "$found_iteration" ]; then
            echo "::warning::No iteration-N label found on PR #$PR. If the review requests changes, the loop will stop with stage:blocked rather than guess an iteration number."
          elif [ "$iteration_label_count" -gt 1 ]; then
            echo "::warning::Multiple iteration-N labels found on PR #$PR; labels should be mutually exclusive. Treating this as ambiguous state."
            found_iteration=""
          fi

          if [ "$REVIEW_STATE" = "approved" ]; then
            # "Approved" alone isn't a stop condition — docs/orchestration.md
            # requires review pass AND green CI. Check the PR's status/check
            # rollup before treating this as done.
            # shellcheck disable=SC2016 # jq's own $c syntax, not a shell var.
            ci_state="$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
              --jq '[.statusCheckRollup[].conclusion] as $c | if ($c|length)==0 then "PENDING" elif ($c | any(. == "FAILURE" or . == "TIMED_OUT" or . == "CANCELLED" or . == "ACTION_REQUIRED" or . == "STARTUP_FAILURE")) then "FAILURE" elif ($c | any(. == null)) then "PENDING" else "SUCCESS" end')"

            if [ "$ci_state" = "SUCCESS" ]; then
              .github/scripts/remove-labels-if-present.sh pr "$PR" \
                "stage:implementing" "stage:testing" "stage:reviewing"
              gh pr edit "$PR" --repo "$REPO" --add-label "stage:ready-for-human"
              gh pr comment "$PR" --repo "$REPO" --body \
                "Peer review passed on iteration $current_iteration/$MAX_ITERATIONS and CI is green. Loop stopped: **stage:ready-for-human** — ready for final human review."
            else
              gh pr comment "$PR" --repo "$REPO" --body \
                "Peer review passed on iteration $current_iteration/$MAX_ITERATIONS, but CI is not green yet (status: $ci_state). Staying in **stage:reviewing** until CI completes successfully; re-request/re-submit the review once CI passes to advance the loop."
            fi

          elif [ "$REVIEW_STATE" = "changes_requested" ]; then
            if [ -z "$found_iteration" ]; then
              # Can't safely determine which iteration we're on; stop rather
              # than risk looping indefinitely or mislabeling progress.
              .github/scripts/remove-labels-if-present.sh pr "$PR" \
                "stage:implementing" "stage:testing"
              gh pr edit "$PR" --repo "$REPO" --add-label "stage:blocked"
              gh pr comment "$PR" --repo "$REPO" --body \
                "Changes requested, but no \`iteration-N\` label was found on this PR. Loop stopped: **stage:blocked** — needs human triage before continuing."
            elif [ "$current_iteration" -ge "$MAX_ITERATIONS" ]; then
              .github/scripts/remove-labels-if-present.sh pr "$PR" \
                "stage:implementing" "stage:testing" "stage:reviewing"
              gh pr edit "$PR" --repo "$REPO" --add-label "stage:ready-for-human"
              gh pr comment "$PR" --repo "$REPO" --body \
                "Reached the $MAX_ITERATIONS-iteration cap without a clean peer review. Loop stopped: **stage:ready-for-human** (flagged — needs human triage of outstanding review comments)."
            else
              next=$((current_iteration + 1))
              .github/scripts/remove-labels-if-present.sh pr "$PR" \
                "iteration-$current_iteration" "stage:reviewing"
              gh pr edit "$PR" --repo "$REPO" \
                --add-label "iteration-$next" --add-label "stage:implementing"
              gh pr comment "$PR" --repo "$REPO" --body \
                "Review requested changes on iteration $current_iteration/$MAX_ITERATIONS. Starting **iteration $next/$MAX_ITERATIONS**: implement -> test -> review, addressing the open review comments."
            fi
          fi
