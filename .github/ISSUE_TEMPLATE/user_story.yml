name: User Story
description: >
  A story for the `ship` agent. Assign the issue to Copilot with the `ship`
  agent to start planning; nothing is implemented until you approve the plan.
title: "[Story] "
body:
  - type: markdown
    attributes:
      value: |
        Fill this out, then assign the issue to **Copilot** and pick the
        **`ship`** agent. See `README.md` for the commands.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the user story.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Bullet list of concrete, testable conditions for "done".
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      description: Which parts of the stack the story touches.
      options:
        - label: "ui (`/ui` — Vite/React/RTK)"
        - label: "api (`/api` — C#)"
        - label: "infra (Bicep/ACA/Azure SQL/Entra ID/Blob)"

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals / out of scope
      description: What should the agent explicitly NOT do?

  - type: textarea
    id: constraints
    attributes:
      label: Constraints & context
      description: >
        Auth (Entra ID) scopes, Azure SQL schema impact, blob/SAS
        considerations, or other technical constraints the plan should
        account for.
