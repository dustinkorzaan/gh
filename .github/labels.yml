# Label taxonomy for the multi-agent orchestration pipeline.
# Synced by .github/workflows/label-sync.yml on every push to main that
# touches this file. See docs/orchestration.md for how each label is used.

# --- Stage labels (mutually exclusive; orchestrator swaps these) ---
- name: "stage:interview"
  color: "d4c5f9"
  description: "Story is in the plan-interview stage; no implementation yet."
- name: "stage:planned"
  color: "d4c5f9"
  description: "Planner agent has posted a draft plan awaiting approval."
- name: "approved-plan"
  color: "0e8a16"
  description: "Human has approved the plan; unlocks the implement/test/review loop."
- name: "stage:implementing"
  color: "fbca04"
  description: "Implementer agent is actively working this iteration."
- name: "stage:testing"
  color: "fbca04"
  description: "CI (and Playwright, if area:ui) is running for this iteration."
- name: "stage:reviewing"
  color: "fbca04"
  description: "Automated + peer review agent is evaluating this iteration."
- name: "stage:ready-for-human"
  color: "0e8a16"
  description: "Loop stopped (pass or 3-iteration cap); needs final human review/merge."
- name: "stage:blocked"
  color: "b60205"
  description: "Loop stopped without a clean pass; needs human triage."
- name: "stage:paused"
  color: "e99695"
  description: "Manual kill switch; orchestrator must not act while present."
- name: "needs-triage"
  color: "d93f0b"
  description: "Loop stopped at the 3-iteration cap without a clean peer review; needs human triage before merge."

# --- Iteration counters (mutually exclusive; max iteration-3) ---
- name: "iteration-1"
  color: "c5def5"
  description: "First implement/test/review cycle."
- name: "iteration-2"
  color: "c5def5"
  description: "Second implement/test/review cycle (first review failed)."
- name: "iteration-3"
  color: "c5def5"
  description: "Third and final implement/test/review cycle (hard cap)."

# --- Area labels (set by the intake issue form; drive which CI jobs run) ---
- name: "area:ui"
  color: "1d76db"
  description: "Touches /ui (Vite/React/RTK)."
- name: "area:api"
  color: "1d76db"
  description: "Touches /api (C#)."
- name: "area:infra"
  color: "1d76db"
  description: "Touches Bicep/ACA/Azure SQL/Entra ID/Blob infrastructure."
