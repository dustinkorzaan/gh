name: Sync area labels from issue form

# .github/ISSUE_TEMPLATE/user_story.yml's "Affected areas" checkboxes only
# end up as text in the issue body — GitHub issue forms don't translate
# checkbox state into labels automatically. This workflow bridges that gap
# so area:ui / area:api / area:infra labels actually exist on the issue,
# which the orchestrator then mirrors onto the PR it creates
# (.github/workflows/orchestrator.yml) and the E2E workflow gates on
# (.github/workflows/e2e-playwright.yml).

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  sync-area-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply area:* labels from the issue form's checkboxes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: .github/scripts/sync-area-labels-from-body.sh "$REPO" "$ISSUE"
